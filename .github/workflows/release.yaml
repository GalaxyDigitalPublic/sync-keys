name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true

  # A release created with GITHUB_TOKEN does not raise a `release: published`
  # event, so the builds are called directly instead of being triggered by one.
  docker:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write

  artifacts:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
