[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-keys"
version = "0.3.1"
authors = [
    {name = "Thorsten Behrens", email = "yorickdowne@gmail.com"},
    {name = "Dmitri Tsumak", email = "tsumak.dmitri@gmail.com"}
]
description = "Helper script for eth-staking-charts"
readme = "README.md"
dependencies = [
    "click",
    "eth-typing",
    "eth-utils",
    "psycopg2-binary",
    "pycryptodome",
    "PyYAML",
    "ethstaker-deposit @ git+https://github.com/ethstaker/ethstaker-deposit-cli@v1.3.0",  # keystore decryption (sync-db)
    "boto3",  # SYNC_KEYS_DB_AUTH=aws-iam (RDS IAM tokens)
    "azure-identity",  # SYNC_KEYS_DB_AUTH=azure-ad (Entra ID tokens)
]
requires-python = ">=3.9,<4"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[project.scripts]
sync-keys = "sync_keys.main:main"

[project.urls]
"Homepage" = "https://github.com/CryptoManufaktur-io/sync-keys"
